name: autopost (FB + IG Reels)

# Runs every 15 minutes; publishes a post only when its time has come (autopost/calendar.json,
# Algiers time), the entry is "approved": true, and the repo variable AUTOPOST_ENABLED is "true".
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = read-only test of the token · plan = list the calendar · publish = publish what is due"
        type: choice
        options: [check, plan, publish]
        default: check
      dry_run:
        description: "dry run (no POST to Meta)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            autopost
          lfs: false

      - name: Run
        env:
          MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
          AUTOPOST_ENABLED: ${{ vars.AUTOPOST_ENABLED }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_REF: autopost-media
        run: python3 autopost/publish.py

      - name: Save state
        if: always()
        run: |
          if git diff --quiet -- autopost/state.json 2>/dev/null && ! git ls-files --others --exclude-standard autopost | grep -q state.json; then
            echo "no state change"; exit 0
          fi
          git config user.name "autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autopost/state.json
          git commit -m "autopost: state $(TZ=Africa/Algiers date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${{ github.event.repository.default_branch }}" && git push --quiet && exit 0
            sleep 5
          done
          echo "::error::could not push state.json"; exit 1
